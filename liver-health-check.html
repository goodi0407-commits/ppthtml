<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>간 건강 체크리스트</title><style>body{font:18px/1.7 system-ui;max-width:780px;margin:auto;padding:20px}fieldset{margin:16px 0;border:1px solid #aaa;border-radius:10px}legend{font-weight:bold}label{margin-right:18px;display:inline-block;padding:8px}button{padding:12px;font-size:19px}#out{border:2px solid #357;padding:18px;margin-top:20px}</style><h1>간 건강 자가 체크리스트</h1><p>학생용 학습자료입니다. 간 질환을 진단하거나 건강한 간을 확정할 수 없습니다. 초기 간 질환은 증상이 없을 수 있습니다.</p><form id="f"></form><button id="go">결과 확인</button><section id="out" role="status" aria-live="polite"></section><p>의학 참고: <a href="https://www.niddk.nih.gov/health-information/liver-disease/cirrhosis/symptoms-causes">미국 NIDDK 간경변 증상과 원인</a></p><script>const groups=[["응급 신호",["피를 토했거나 검고 끈적한 변을 보았나요?","갑자기 의식이 흐려지거나 심한 혼란이 있나요?","황달과 함께 고열 또는 심한 복통이 있나요?"]],["간 관련 증상",["눈 흰자위나 피부가 노랗게 변했나요?","소변이 콜라색처럼 진해졌나요?","대변이 회백색으로 변했나요?","이유 없이 가려움이 계속되나요?","충분히 쉬어도 피로가 계속되나요?","이유 없이 식욕이나 체중이 감소했나요?","배가 부풀거나 다리가 붓나요?","쉽게 멍이 들거나 출혈이 생기나요?"]],["위험요인",["B형 또는 C형 간염을 진단받았나요?","지방간 또는 다른 간 질환을 진단받았나요?","간수치 이상을 안내받았나요?","비만, 당뇨병 또는 이상지질혈증이 있나요?","과음이 반복되나요?","약을 권장량보다 많이 복용하거나 여러 보충제를 복용하나요?","가족 중 간경변이나 유전성 간 질환 진단자가 있나요?"]]];let n=0;const form=document.getElementById("f");groups.forEach((g,k)=>{let h=document.createElement("h2");h.textContent=g[0];form.append(h);g[1].forEach(q=>{let fs=document.createElement("fieldset"),l=document.createElement("legend");l.textContent=++n+". "+q;fs.append(l);["예","아니요","잘 모르겠어요"].forEach((v,i)=>{let lab=document.createElement("label"),input=document.createElement("input");input.type="radio";input.name="q"+n;input.value=i;lab.append(input,document.createTextNode(v));fs.append(lab)});form.append(fs)})});document.getElementById("go").onclick=()=>{let yes=[],missing=0,idx=0;groups.forEach((g,k)=>g[1].forEach(q=>{idx++;let el=document.querySelector('input[name="q'+idx+'"]:checked');if(!el)missing++;else if(el.value==="0")yes.push({idx,k,q})}));let emergency=yes.some(x=>x.k===0),jaundice=yes.some(x=>x.idx===4),symptom=yes.some(x=>x.k===1),risk=yes.some(x=>x.k===2);let msg=emergency?"응급 신호가 있습니다. 119 또는 응급실에 즉시 도움을 요청하세요.":jaundice?"황달 가능성이 있습니다. 가능한 한 빨리 진료받으세요.":symptom?"증상이 있으므로 의료진과 상담하세요.":risk?"위험요인이 있으므로 검사가 필요한지 의료진과 상담하세요.":"보고된 뚜렷한 위험 신호가 없지만 간이 건강하다는 의미는 아닙니다.";document.getElementById("out").textContent=msg+" 예 응답 "+yes.length+"개, 미응답 "+missing+"개. 본 결과는 의학적 진단이 아닙니다.";document.getElementById("out").scrollIntoView()};</script></html>
